name = "mindcare-frontend"
compatibility_date = "2026-10-29"
pages_build_output_dir = "."

# Cloudflare Pages configuration
[build]
# No build command needed for static site
command = "echo 'Static site - no build required'"
# Output directory is project root
destination = "."

# Custom routes (optional - for SPA-like behavior if needed)
# [[routes]]
# pattern = "/*"
# script_name = ""

# Environment variables (set these in Cloudflare dashboard instead for secrets)
# [vars]
# ENVIRONMENT = "production"

# Headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/style.css"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"
    content-type = "text/css; charset=utf-8"

[[headers]]
  for = "/javascript/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    x-frame-options = "DENY"
    x-content-type-options = "nosniff"
    referrer-policy = "strict-origin-when-cross-origin"
    permissions-policy = "camera=(), microphone=(), geolocation=()"

# Redirect www to non-www (or vice versa) - customize as needed
# [[redirects]]
# source = "https://www.yourdomain.com/*"
# destination = "https://yourdomain.com/*"
# status = 301