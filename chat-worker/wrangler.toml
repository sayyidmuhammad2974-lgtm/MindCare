name = "mindcare-chat-api"
main = "worker.mjs"
compatibility_date = "2026-10-29"

# Backend chat AI (port dari backend/server.mjs).
# Secret NVIDIA_API_KEY di-set via: npx wrangler secret put NVIDIA_API_KEY
# (deploy dari folder ini: npx wrangler deploy)
[vars]
NVIDIA_MODEL = "nvidia/nemotron-3-ultra-550b-a55b"
NVIDIA_TIMEOUT = "120"
NVIDIA_MAX_TOKENS = "700"
NVIDIA_REASONING_EFFORT = "none"
NVIDIA_TEMPERATURE = "1"
NVIDIA_TOP_P = "0.95"
CHAT_RATE_LIMIT = "8"
CHAT_RATE_WINDOW_MS = "60000"
FRONTEND_URL = "https://mindcare-frontend.mikael-putra001.workers.dev,http://127.0.0.1:5500,http://localhost:5500"
